ServerName localhost

<Directory /var/www/html/ncc>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex customer.php
</Directory>

# Configuration files are readable by PHP, but must never be served as text.
<FilesMatch "(?i)^(\..*|crmprops(?:\..*)?|Dockerfile|compose\.ya?ml|.*\.(?:sql|md|sh|log|ini|conf|nodeflow|tgz|zip))$">
    Require all denied
</FilesMatch>

<Directory /var/www/html/ncc/docker>
    Require all denied
</Directory>

# Legacy setup/status endpoints can write configuration or expose its contents.
<LocationMatch "^/ncc/(?:index|ping)\.php(?:/|$)">
    Require all denied
</LocationMatch>
