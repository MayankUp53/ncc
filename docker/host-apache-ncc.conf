# HOST Apache snippet: add inside the existing c047.ameyoj.com :443 VirtualHost.
# Keep its current SSL configuration, forwarded headers and other application routes.
# Docker publishes this app with: -p 127.0.0.1:18084:80
# Both paths include /ncc/ because that is the application's path inside the image.

RedirectMatch 301 ^/ncc$ /ncc/
ProxyPass        /ncc/ http://127.0.0.1:18084/ncc/
ProxyPassReverse /ncc/ http://127.0.0.1:18084/ncc/
